<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#081d33">
  <title>Reel Adventure Tours - Offline</title>
  <link rel="icon" href="/icons/icon-192.png">
  <style>
    :root {
      color-scheme: light;
      --navy: #081d33;
      --blue: #0f72b8;
      --aqua: #24b7c7;
      --ink: #17202a;
      --muted: #5e6a76;
      --surface: #ffffff;
      --shell: #edf4f8;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--shell);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(480px, 100%);
      padding: 28px;
      border: 1px solid rgba(8, 29, 51, 0.12);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 18px 50px rgba(8, 29, 51, 0.12);
    }
    img {
      width: 68px;
      height: 68px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 18px;
    }
    p:first-of-type {
      margin: 0 0 6px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 12px;
      color: var(--navy);
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 6px;
      background: var(--blue);
      color: #fff;
      font-weight: 800;
      text-decoration: none;
    }
    a:focus-visible {
      outline: 3px solid var(--aqua);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Reel Adventure Tours">
    <p>Offline mode</p>
    <h1>Reel Adventure Tours Operations</h1>
    <p>The live server is unavailable right now. Reopen the app when your connection returns, or use any screens already cached on this device.</p>
    <a href="/index.html">Try Again</a>
  </main>
</body>
</html>

services:
  - type: web
    name: reel-adventure-operations-app
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: python server.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: WHATSAPP_AUTO_SEND_ENABLED
        value: "1"
      - key: WHATSAPP_AUTO_SEND_LIMIT
        value: "10"
      - key: WHATSAPP_CUSTOMER_AUTO_SEND
        value: "0"
